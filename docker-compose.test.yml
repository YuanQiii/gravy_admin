services:
  postgres-test:
    image: postgres:17-alpine
    container_name: gvray-admin-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: gvray_admin_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - nest-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gvray_admin_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-test:
    image: redis:7-alpine
    container_name: gvray-admin-redis-test
    restart: "no"
    ports:
      - "6380:6379"
    volumes:
      - redis-test-data:/data
    networks:
      - nest-test
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-test-data:
  redis-test-data:

networks:
  nest-test:
    driver: bridge
