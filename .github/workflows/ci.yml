name: CI

# 重型门禁：类型检查与测试。纯文档改动不跑本工作流（见 `paths`），
# 文档改动由独立的 docs-check.yml 负责。

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # 必须逐个 workspace 用 -p：裸跑根目录 tsc 会因根 tsconfig 的 @/* 残留成批报 TS2307
      - name: typecheck（四个 workspace 全绿才算通过）
        run: |
          set -e
          for ws in apps/admin apps/mall packages/core packages/domain; do
            echo "::group::tsc -p $ws/tsconfig.json"
            pnpm exec tsc -p "$ws/tsconfig.json" --noEmit
            echo "::endgroup::"
          done

      - name: test
        run: pnpm test -- --ci

  lint-ratchet:
    name: fmt + lint（棘轮：不新增问题）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # 全仓基线是红的（fmt 212 文件 / lint 1718 条），不可能在每次改动里刷绿。
      # 因此棘轮判据是「不新增问题」而非「全绿」，逐文件对比基线版本：
      #   · prettier：基线版本本就合规 → 本次改动后必须仍合规（新文件一律必须合规）
      #   · eslint  ：本次的 error 数不得高于基线（warning 不设卡）
      # 读取版本一律经 `tr -d '\r'` 归一化换行，使判定不受 CRLF 影响。
      - name: 计算基线与本次改动的 TS 文件
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}"
          elif [ "$(git rev-list --parents -n 1 "${{ github.sha }}" | wc -w)" -gt 2 ]; then
            # 合并提交：只把「这次合并带进来的改动」算作本次改动。
            # 若用 event.before..sha，被合并进来的历史提交会整批计入，
            # 首个推送到 main 的合并会把几十个历史提交的文件全算上。
            BASE="${{ github.sha }}^1"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" \
            | grep -E '^(apps|packages|test)/.*\.ts$' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "--- 基线 $BASE，本次改动 TS 文件 ---"
          cat changed.txt

      - name: fmt 棘轮（基线合规的文件不得变脏）
        if: steps.changed.outputs.count != '0'
        run: |
          base='${{ steps.changed.outputs.base }}'
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git cat-file -e "$base:$f" 2>/dev/null; then
              # 已存在的文件：基线版本本就不合规则跳过（既有基线债务，不要求本次偿还）
              git show "$base:$f" | tr -d '\r' \
                | pnpm exec prettier --check --stdin-filepath "$f" >/dev/null 2>&1 || continue
            fi
            if ! tr -d '\r' < "$f" | pnpm exec prettier --check --stdin-filepath "$f" >/dev/null 2>&1; then
              echo "::error file=$f::不符合 prettier 格式（新增文件，或基线版本本已合规）"
              fail=1
            fi
          done < changed.txt
          if [ "$fail" = 0 ]; then echo "fmt 棘轮：无新增格式问题"; fi
          exit $fail

      - name: lint 棘轮（error 数不得高于基线）
        if: steps.changed.outputs.count != '0'
        run: |
          base='${{ steps.changed.outputs.base }}'
          count_errors() {
            pnpm exec eslint --stdin --stdin-filename "$1" -f json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let n=0;try{n=JSON.parse(s||"[]").reduce((a,f)=>a+(f.errorCount||0),0)}catch(e){}process.stdout.write(String(n))})'
          }
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git cat-file -e "$base:$f" 2>/dev/null; then
              before=$(git show "$base:$f" | tr -d '\r' | count_errors "$f")
            else
              before=0
            fi
            after=$(tr -d '\r' < "$f" | count_errors "$f")
            echo "$f: eslint error $before -> $after"
            if [ "$after" -gt "$before" ]; then
              echo "::error file=$f::eslint error 数由 $before 增至 $after"
              fail=1
            fi
          done < changed.txt
          if [ "$fail" = 0 ]; then echo "lint 棘轮：无新增 error"; fi
          exit $fail
