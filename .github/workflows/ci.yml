name: CI

# 重型门禁：类型检查与测试。纯文档改动不跑本工作流（见 `paths`），
# 文档改动由独立的 docs-check.yml 负责。

on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # 必须逐个 workspace 用 -p：裸跑根目录 tsc 会因根 tsconfig 的 @/* 残留成批报 TS2307
      - name: typecheck（四个 workspace 全绿才算通过）
        run: |
          set -e
          for ws in apps/admin apps/mall packages/core packages/domain; do
            echo "::group::tsc -p $ws/tsconfig.json"
            pnpm exec tsc -p "$ws/tsconfig.json" --noEmit
            echo "::endgroup::"
          done

      - name: test
        run: pnpm test -- --ci

  lint-ratchet:
    name: fmt + lint（棘轮：不新增问题）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # 全仓基线是红的（fmt 212 文件 / lint 1718 条），不可能在每次改动里刷绿。
      # 因此棘轮判据是「不新增问题」而非「全绿」，逐文件对比基线版本：
      #   · prettier：基线版本本就合规 → 本次改动后必须仍合规（新文件一律必须合规）
      #   · eslint  ：本次的 error 数不得高于基线（warning 不设卡）
      # 读取版本一律经 `tr -d '\r'` 归一化换行，使判定不受 CRLF 影响。
      - name: 计算基线与本次改动的 TS 文件
        id: changed
        run: |
          # 单次推送带进来的文件数超过这个上限时，认为这次推送携带的是积压的历史提交，
          # 而不是「本次改动」——按 before..sha 全量计算会把几十个历史提交的文件都算成本次新增，
          # 门禁首跑即红，继而失去信任（design.md 把它列为明确风险）。
          RATCHET_MAX_FILES=50
          NULL_SHA=0000000000000000000000000000000000000000
          END="${{ github.sha }}"
          BEFORE="${{ github.event.before }}"
          BASE=""
          REASON=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
            REASON="PR 基线"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "$NULL_SHA" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # **新分支的首次推送**：`event.before` 是全 0 SHA（或该对象在本地不存在），没有可比基线。
            # 必须单独处理——否则 `git rev-list --merges "$BASE..$END"` 会因 bad object 直接报错，
            # 门禁不是判红而是崩掉，这种失败比判红更难懂。
            REASON="首次推送：无可比基线，只检查最后一个提交"
            BASE="$(git rev-parse "$END^" 2>/dev/null || true)"
          else
            MERGE="$(git rev-list --merges "$BEFORE..$END" 2>/dev/null | head -1)"
            if [ -n "$MERGE" ]; then
              # 合并提交：只取「这次合并带进来的改动」。积压推送里最典型的就是一个 merge，
              # 它的贡献正是从远端视角看的新工作。
              REASON="本次推送含合并提交 $MERGE，取其 ^1..merge"
              BASE="$(git rev-parse "$MERGE^1")"
              END="$MERGE"
            elif [ "$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$END" | wc -l)" -gt "$RATCHET_MAX_FILES" ]; then
              REASON="推送范围超过 $RATCHET_MAX_FILES 个文件且不含合并提交，只检查最后一个提交"
              BASE="$(git rev-parse "$END^")"
            else
              REASON="普通推送"
              BASE="$BEFORE"
            fi
          fi

          echo "策略：$REASON"
          if [ -z "$BASE" ]; then
            # 根提交（没有父提交）时无可比对象：跳过棘轮，而不是猜一个基线。
            echo "无可用基线，本次跳过棘轮"
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only --diff-filter=ACMR "$BASE" "$END" \
            | grep -E '^(apps|packages|test)/.*\.ts$' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "--- 基线 $BASE → $END，本次改动 TS 文件 ---"
          cat changed.txt

      - name: fmt 棘轮（基线合规的文件不得变脏）
        if: steps.changed.outputs.count != '0'
        run: |
          base='${{ steps.changed.outputs.base }}'
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git cat-file -e "$base:$f" 2>/dev/null; then
              # 已存在的文件：基线版本本就不合规则跳过（既有基线债务，不要求本次偿还）
              git show "$base:$f" | tr -d '\r' \
                | pnpm exec prettier --check --stdin-filepath "$f" >/dev/null 2>&1 || continue
            fi
            if ! tr -d '\r' < "$f" | pnpm exec prettier --check --stdin-filepath "$f" >/dev/null 2>&1; then
              echo "::error file=$f::不符合 prettier 格式（新增文件，或基线版本本已合规）"
              fail=1
            fi
          done < changed.txt
          if [ "$fail" = 0 ]; then echo "fmt 棘轮：无新增格式问题"; fi
          exit $fail

      - name: lint 棘轮（error 数不得高于基线）
        if: steps.changed.outputs.count != '0'
        run: |
          base='${{ steps.changed.outputs.base }}'
          count_errors() {
            pnpm exec eslint --stdin --stdin-filename "$1" -f json 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let n=0;try{n=JSON.parse(s||"[]").reduce((a,f)=>a+(f.errorCount||0),0)}catch(e){}process.stdout.write(String(n))})'
          }
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git cat-file -e "$base:$f" 2>/dev/null; then
              before=$(git show "$base:$f" | tr -d '\r' | count_errors "$f")
            else
              before=0
            fi
            after=$(tr -d '\r' < "$f" | count_errors "$f")
            echo "$f: eslint error $before -> $after"
            if [ "$after" -gt "$before" ]; then
              echo "::error file=$f::eslint error 数由 $before 增至 $after"
              fail=1
            fi
          done < changed.txt
          if [ "$fail" = 0 ]; then echo "lint 棘轮：无新增 error"; fi
          exit $fail
