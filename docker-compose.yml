services:
  postgres:
    image: postgres:17-alpine
    container_name: gvray-admin-postgres
    restart: unless-stopped
    env_file:
      - path: .env.${ENV:-production}
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gvray_admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nest-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-gvray_admin}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  admin:
    image: ${IMAGE:-gvray/gvray-admin:latest}
    container_name: gvray-admin-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.${ENV:-production}
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-gvray_admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-2h}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      PORT: ${PORT:-3000}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-123456}
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_HOST: redis
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - nest-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT||3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mall:
    image: ${MALL_IMAGE:-gvray/gvray-mall:latest}
    container_name: gvray-mall-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env.${ENV:-production}
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-gvray_admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-2h}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      PORT: ${MALL_PORT:-3001}
      ENABLE_CORS: ${ENABLE_CORS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_HOST: redis
    ports:
      - "${MALL_PORT:-3001}:${MALL_PORT:-3001}"
    networks:
      - nest-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT||3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${WEB_IMAGE:-gvray/react-umi-admin:latest}
    container_name: gvray-admin-web
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - nest-net

  redis:
    image: redis:7-alpine
    container_name: gvray-admin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nest-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:

networks:
  nest-net:
    driver: bridge
