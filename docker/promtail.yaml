# promtail 配置：采集 app 容器的 stdout 结构化日志并推送 Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 本地（host）运行的应用日志：宿主机 ./logs/app.log 挂载为 /logs/app.log 后采集。
  # 适用于宿主机直跑生产模式应用（非容器）时，将 stdout 重定向到该文件。
  - job_name: gvray-admin-local
    static_configs:
      - targets: [localhost]
        labels:
          __path__: /logs/*.log
          service: gvray-admin
          job: gvray-admin
          env: production
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:

  - job_name: gvray-admin
    # Docker 引擎发现：仅采集主应用容器 gvray-admin-app 的 stdout
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '^gvray-admin-app$'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: service
      - target_label: job
        replacement: gvray-admin
      # 环境标签：主应用为 production（开发环境可自行调整）
      - target_label: env
        replacement: production
    # 解析单行 JSON，抽取 level 作为查询标签
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
    # 仅保留单行结构化日志按行推送（pino 已输出单行 JSON）
    encoding: utf8